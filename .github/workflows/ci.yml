# Runs on every pull request (including Renovate's) and on pushes to main.
# Renovate only auto-merges an update once every job here passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ProjectMonitor.sln
      - name: Check formatting
        run: dotnet format ProjectMonitor.sln --verify-no-changes --no-restore
      - run: dotnet build ProjectMonitor.sln --no-restore -c Release
      - run: dotnet test ProjectMonitor.sln --no-build -c Release
      - name: Check the Docker image builds
        run: docker build -f ProjectMonitor.Core/Dockerfile -t projectmonitor:ci .
